// constantes grille
const HAUTEURS_RANGEES = [19.5, 19.5, 19.5, 19.5, 5, 5, 19.5, 19.5, 19.5, 19.5];
const TOTAL_HAUTEURS   = HAUTEURS_RANGEES.reduce((a, b) => a + b, 0);
const LARGEUR_COLONNE  = 5;
const LARGEUR_GRAND_CANVAS = 4000;


const EM = 1000, ASCENDANTE = 800, DESCENDANTE = -200;

// spécimen complet pour export fonte
const SPECIMEN = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~ÉÈÀàéèäôâÂÄËÊêëîïÎÏÛÜûüÚú";


// calcule la hauteur de chaque rangée et position y de départ
function metriquesRangees(hauteurTotale) {
  const hauteurs = HAUTEURS_RANGEES.map(h => h / TOTAL_HAUTEURS * hauteurTotale);
  const posY = [];
  let y = 0;
  for (let i = 0; i < 10; i++) { posY.push(y); y += hauteurs[i]; }
  return { hauteurs, posY };
}

// largeur d'une colonne en pixels pour une hauteur de grille donnée
function largeurCellule(hauteurTotale) {
  return LARGEUR_COLONNE / TOTAL_HAUTEURS * hauteurTotale;
}


// pixelisation caractère
function pixeliserCaractere(ch, etat) {
  const H  = etat.renderSize;
  const LC = largeurCellule(H);
  const { hauteurs, posY } = metriquesRangees(H);

  // dessin du caractère sur un grand canvas pour pas le couper
  const grandCanvas = document.createElement('canvas');
  grandCanvas.width  = LARGEUR_GRAND_CANVAS;
  grandCanvas.height = H;
  const grandCtx = grandCanvas.getContext('2d');
  grandCtx.font         = `${etat.fontStyle} ${etat.fontWeight} ${H * etat.fontSize}px ${etat.font}`;
  grandCtx.textBaseline = 'alphabetic';
  grandCtx.fillStyle    = '#000';
  grandCtx.fillText(ch, LARGEUR_GRAND_CANVAS / 2, H * 0.78 + etat.yOffset);

  // scan pixel pour trouver bornes du glyphe
  const pixels = grandCtx.getImageData(0, 0, LARGEUR_GRAND_CANVAS, H).data;
  let minX = LARGEUR_GRAND_CANVAS, maxX = 0, trouve = false;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < LARGEUR_GRAND_CANVAS; x++) {
      if (pixels[(y * LARGEUR_GRAND_CANVAS + x) * 4 + 3] > 15) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        trouve = true;
      }
    }
  }
  if (!trouve) return { grille: [], colonnes: 0, largeurCellule: LC };

  // recadrage autour du glyphe avec marge d'une cellule
  const marge  = Math.ceil(LC);
  const debutX = Math.max(0, minX - marge);
  const largeur = Math.min(LARGEUR_GRAND_CANVAS, maxX + marge + 1) - debutX;

  const canvasRecadre = document.createElement('canvas');
  canvasRecadre.width  = largeur;
  canvasRecadre.height = H;
  const ctxRecadre = canvasRecadre.getContext('2d');
  ctxRecadre.drawImage(grandCanvas, debutX, 0, largeur, H, 0, 0, largeur, H);

  // scan de chaque cellule de la grille
  const debutGlyphe  = minX - debutX;
  const nbColonnes   = Math.ceil((maxX - minX + 1) / LC);
  const pixelsRecadres = ctxRecadre.getImageData(0, 0, largeur, H).data;

  const grille = [];
  for (let rangee = 0; rangee < 10; rangee++) {
    grille[rangee] = [];
    const ry = Math.round(posY[rangee]);
    const rh = Math.max(1, Math.round(hauteurs[rangee]));

    for (let col = 0; col < nbColonnes; col++) {
      const cx = Math.round(debutGlyphe + col * LC);
      const cw = Math.max(1, Math.round(LC));
      let remplis = 0, total = 0;
      for (let py = ry; py < Math.min(ry + rh, H); py++) {
        for (let px = cx; px < Math.min(cx + cw, largeur); px++) {
          if (pixelsRecadres[(py * largeur + px) * 4 + 3] > 15) remplis++;
          total++;
        }
      }
      grille[rangee][col] = total > 0 && remplis / total >= etat.threshold;
    }
  }

  return { grille, colonnes: nbColonnes, largeurCellule: LC };
}


// dessine grille sur canvas
function dessinerGrille(canvasCible, glyphes, hauteurGrille, largeurCol, ecartement, couleur) {
  const { hauteurs, posY } = metriquesRangees(hauteurGrille);
  const largeurTotale = glyphes.reduce((somme, g, i) =>
    somme + g.colonnes * largeurCol + (i < glyphes.length - 1 ? ecartement : 0), 0);

  canvasCible.width  = Math.ceil(largeurTotale) + 2;
  canvasCible.height = Math.ceil(hauteurGrille) + 2;

  const ctx = canvasCible.getContext('2d');
  ctx.clearRect(0, 0, canvasCible.width, canvasCible.height);

  let decalageX = 1;
  for (const { grille, colonnes } of glyphes) {
    for (let rangee = 0; rangee < 10; rangee++) {
      for (let col = 0; col < colonnes; col++) {
        const x  = decalageX + col * largeurCol;
        const y  = 1 + posY[rangee];
        const lc = largeurCol - 0.5;
        const hc = hauteurs[rangee] - 0.5;
        if (grille[rangee] && grille[rangee][col]) {
          ctx.fillStyle = couleur;
          ctx.fillRect(x, y, lc, hc);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.03)';
          ctx.fillRect(x, y, lc, hc);
          ctx.strokeStyle = 'rgba(0,0,0,0.08)';
          ctx.lineWidth = 0.3;
          ctx.strokeRect(x + 0.15, y + 0.15, lc - 0.3, hc - 0.3);
        }
      }
    }
    decalageX += colonnes * largeurCol + ecartement;
  }
}


// export svg
function exporterSVG(glyphes, largeurCol, hauteurGrille, ecartement, couleur, nomFichier) {
  const { hauteurs, posY } = metriquesRangees(hauteurGrille);
  const largeurTotale = glyphes.reduce((somme, g, i) =>
    somme + g.colonnes * largeurCol + (i < glyphes.length - 1 ? ecartement : 0), 0);

  let rectangles = '', decalageX = 0;
  for (const { grille, colonnes } of glyphes) {
    for (let rangee = 0; rangee < 10; rangee++) {
      for (let col = 0; col < colonnes; col++) {
        if (grille[rangee] && grille[rangee][col]) {
          const x = decalageX + col * largeurCol;
          rectangles += `<rect x="${x.toFixed(2)}" y="${posY[rangee].toFixed(2)}" width="${(largeurCol - 0.5).toFixed(2)}" height="${(hauteurs[rangee] - 0.5).toFixed(2)}" fill="${couleur}"/>`;
        }
      }
    }
    decalageX += colonnes * largeurCol + ecartement;
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${largeurTotale.toFixed(0)}" height="${hauteurGrille}">${rectangles}</svg>`;
  const lien = document.createElement('a');
  lien.href     = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  lien.download = nomFichier;
  lien.click();
}


// conversion grille vers contours opentype
function grilleVersCheminOpenType(grille, colonnes, largeurCol, hauteurRendu) {
  const { hauteurs, posY } = metriquesRangees(hauteurRendu);
  const echelle = EM / hauteurRendu;
  const chemin  = new opentype.Path();

  for (let rangee = 0; rangee < 10; rangee++) {
    const yHaut = ASCENDANTE - (posY[rangee] / hauteurRendu) * (ASCENDANTE - DESCENDANTE);
    const yBas  = ASCENDANTE - ((posY[rangee] + hauteurs[rangee]) / hauteurRendu) * (ASCENDANTE - DESCENDANTE);

    for (let col = 0; col < colonnes; col++) {
      if (!grille[rangee] || !grille[rangee][col]) continue;
      const xG = col * largeurCol * echelle;
      const xD = (col + 1) * largeurCol * echelle;
      chemin.moveTo(xG, yBas);
      chemin.lineTo(xG, yHaut);
      chemin.lineTo(xD, yHaut);
      chemin.lineTo(xD, yBas);
      chemin.close();
    }
  }
  return chemin;
}

// mesure du kerning depuis le navigateur
function mesurerKerning(caracteres, chainePolice) {
  const TAILLE_MESURE = 200;
  const policeDesMesures = chainePolice.replace(/\d+(\.\d+)?px/, TAILLE_MESURE + 'px');

  const c = document.createElement('canvas');
  c.width = 2; c.height = 2;
  const ctx = c.getContext('2d');
  ctx.font = policeDesMesures;
  ctx.fontKerning = 'normal';

  const largeursSingles = {};
  for (const ch of caracteres) largeursSingles[ch] = ctx.measureText(ch).width;

  const pairesKerning = {};
  for (const a of caracteres) {
    for (const b of caracteres) {
      const kern = ctx.measureText(a + b).width - largeursSingles[a] - largeursSingles[b];
      if (Math.abs(kern) > 0.1) pairesKerning[a + '|' + b] = Math.round(kern * (EM / TAILLE_MESURE));
    }
  }
  return pairesKerning;
}


// export otf
document.getElementById('exportOTF').onclick = function () {
  if (typeof opentype === 'undefined') return;
  const etat     = lireEtatTexte();
  const nomFonte = document.getElementById('fontName').value || 'GrilleTypo';
  const caracteres = [...new Set(SPECIMEN.split(''))].filter(c => c.trim() !== '');

  setTimeout(() => {
    const chainePolice = `${etat.fontStyle} ${etat.fontWeight} ${etat.renderSize * etat.fontSize}px ${etat.font}`;
    const pairesKerning = mesurerKerning(caracteres, chainePolice);

    const glyphes = [new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 500, path: new opentype.Path() })];
    const glypheParCaractere = {};

    for (const ch of caracteres) {
      const res = pixeliserCaractere(ch, etat);
      if (!res.colonnes) continue;
      const g = new opentype.Glyph({
        name:         'uni' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'),
        unicode:      ch.codePointAt(0),
        advanceWidth: Math.round(res.colonnes * res.largeurCellule * (EM / etat.renderSize)),
        path:         grilleVersCheminOpenType(res.grille, res.colonnes, res.largeurCellule, etat.renderSize)
      });
      glyphes.push(g);
      glypheParCaractere[ch] = g;
    }

    const fonte = new opentype.Font({
      familyName: nomFonte,
      styleName:  'Regular',
      unitsPerEm: EM,
      ascender:   ASCENDANTE,
      descender:  DESCENDANTE,
      glyphs:     glyphes
    });

    const entreeKerning = [];
    for (const [paire, valeur] of Object.entries(pairesKerning)) {
      const [a, b] = paire.split('|');
      if (glypheParCaractere[a] && glypheParCaractere[b]) {
        entreeKerning.push({
          leftIndex:  glyphes.indexOf(glypheParCaractere[a]),
          rightIndex: glyphes.indexOf(glypheParCaractere[b]),
          value:      valeur
        });
      }
    }
    if (entreeKerning.length > 0) {
      fonte.tables.kern = { version: 0, subtables: [{ coverage: 1, format: 0, pairs: entreeKerning }] };
    }

    fonte.download(nomFonte + '.otf');
  }, 50);
};

// mode dessin
const DESSIN_W = 2700, DESSIN_H = 900;
const DESSIN_LC   = largeurCellule(DESSIN_H);
const DESSIN_COLS = Math.ceil(DESSIN_W / DESSIN_LC);
const { hauteurs: RANGEES_H, posY: RANGEES_Y } = metriquesRangees(DESSIN_H);

const canvasDessin   = document.getElementById('canvasDessin');
const ctxDessin      = canvasDessin.getContext('2d');
const canvasResultat = document.getElementById('canvasResultat');

canvasDessin.width  = DESSIN_W;
canvasDessin.height = DESSIN_H;
ctxDessin.clearRect(0, 0, DESSIN_W, DESSIN_H);

const RESULTAT_W = Math.ceil(DESSIN_COLS * DESSIN_LC) + 2;
const RESULTAT_H = Math.ceil(DESSIN_H) + 2;
canvasResultat.width  = RESULTAT_W;
canvasResultat.height = RESULTAT_H;

let enDessin = false, outilActif = 'dessin', dernierePos = null;

function lireEtatDessin() {
  return {
    tailleBrosse: parseInt(document.getElementById('brushSize').value),
    threshold:    parseInt(document.getElementById('drawThreshold').value) / 100,
    couleur:      document.getElementById('drawColor').value,
  };
}

function rendreDessin() {
  const e = lireEtatDessin();

  // convertit le canvas de dessin en canal alpha (noir = rempli)
  const tmp    = document.createElement('canvas');
  tmp.width    = DESSIN_W;
  tmp.height   = DESSIN_H;
  const ctxTmp = tmp.getContext('2d');
  ctxTmp.drawImage(canvasDessin, 0, 0);
  const pixels = ctxTmp.getImageData(0, 0, DESSIN_W, DESSIN_H);
  for (let i = 0; i < pixels.data.length; i += 4) {
    const alpha = pixels.data[i + 3];
    pixels.data[i] = pixels.data[i+1] = pixels.data[i+2] = 0;
    pixels.data[i+3] = alpha > 10 ? alpha : 0;
  }
  ctxTmp.putImageData(pixels, 0, 0);

  const pixelsConvertis = ctxTmp.getImageData(0, 0, DESSIN_W, DESSIN_H).data;
  const ctx = canvasResultat.getContext('2d');
  ctx.clearRect(0, 0, RESULTAT_W, RESULTAT_H);

  for (let rangee = 0; rangee < 10; rangee++) {
    const ry = Math.round(RANGEES_Y[rangee]);
    const rh = Math.max(1, Math.round(RANGEES_H[rangee]));
    for (let col = 0; col < DESSIN_COLS; col++) {
      const cx = Math.round(col * DESSIN_LC);
      const cw = Math.max(1, Math.round(DESSIN_LC));
      let remplis = 0, total = 0;
      for (let py = ry; py < Math.min(ry + rh, DESSIN_H); py++) {
        for (let px = cx; px < Math.min(cx + cw, DESSIN_W); px++) {
          if (pixelsConvertis[(py * DESSIN_W + px) * 4 + 3] > 15) remplis++;
          total++;
        }
      }
      const actif = total > 0 && remplis / total >= e.threshold;
      const x = 1 + col * DESSIN_LC, y = 1 + RANGEES_Y[rangee];
      const lc = DESSIN_LC - 0.5, hc = RANGEES_H[rangee] - 0.5;
      if (actif) {
        ctx.fillStyle = e.couleur;
        ctx.fillRect(x, y, lc, hc);
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        ctx.fillRect(x, y, lc, hc);
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 0.3;
        ctx.strokeRect(x + 0.15, y + 0.15, lc - 0.3, hc - 0.3);
      }
    }
  }
}

function positionSurCanvas(evenement, canvas) {
  const rect   = canvas.getBoundingClientRect();
  const source = evenement.touches ? evenement.touches[0] : evenement;
  return {
    x: (source.clientX - rect.left) * (canvas.width / rect.width),
    y: (source.clientY - rect.top)  * (canvas.height / rect.height)
  };
}

function tracerTrait(pos) {
  const e   = lireEtatDessin();
  const enc = outilActif === 'gomme' ? 'rgba(0,0,0,1)' : '#000';
  ctxDessin.globalCompositeOperation = outilActif === 'gomme' ? 'destination-out' : 'source-over';
  if (dernierePos) {
    ctxDessin.strokeStyle = enc;
    ctxDessin.lineWidth   = e.tailleBrosse;
    ctxDessin.lineCap     = 'round';
    ctxDessin.beginPath();
    ctxDessin.moveTo(dernierePos.x, dernierePos.y);
    ctxDessin.lineTo(pos.x, pos.y);
    ctxDessin.stroke();
  }
  ctxDessin.fillStyle = enc;
  ctxDessin.beginPath();
  ctxDessin.arc(pos.x, pos.y, e.tailleBrosse / 2, 0, Math.PI * 2);
  ctxDessin.fill();
  dernierePos = pos;
  rendreDessin();
}

canvasDessin.addEventListener('mousedown',  e => { enDessin = true;  dernierePos = null; tracerTrait(positionSurCanvas(e, canvasDessin)); });
canvasDessin.addEventListener('mousemove',  e => { if (enDessin) tracerTrait(positionSurCanvas(e, canvasDessin)); });
canvasDessin.addEventListener('mouseup',    () => { enDessin = false; dernierePos = null; });
canvasDessin.addEventListener('mouseleave', () => { enDessin = false; dernierePos = null; });
canvasDessin.addEventListener('touchstart', e => { e.preventDefault(); enDessin = true;  dernierePos = null; tracerTrait(positionSurCanvas(e, canvasDessin)); }, { passive: false });
canvasDessin.addEventListener('touchmove',  e => { e.preventDefault(); if (enDessin) tracerTrait(positionSurCanvas(e, canvasDessin)); }, { passive: false });
canvasDessin.addEventListener('touchend',   () => { enDessin = false; dernierePos = null; });

document.getElementById('toolDraw').onclick  = function () { outilActif = 'dessin'; this.style.borderColor = '#111'; document.getElementById('toolErase').style.borderColor = ''; };
document.getElementById('toolErase').onclick = function () { outilActif = 'gomme';  this.style.borderColor = '#111'; document.getElementById('toolDraw').style.borderColor = ''; };

document.getElementById('clearDraw').onclick = function () {
  ctxDessin.globalCompositeOperation = 'source-over';
  ctxDessin.clearRect(0, 0, DESSIN_W, DESSIN_H);
  canvasResultat.getContext('2d').clearRect(0, 0, RESULTAT_W, RESULTAT_H);
};

document.getElementById('drawExportSVG').onclick = function () {
  const e = lireEtatDessin();
  const { hauteurs, posY } = metriquesRangees(DESSIN_H);
  const tmp    = document.createElement('canvas');
  tmp.width    = DESSIN_W; tmp.height = DESSIN_H;
  const ctxTmp = tmp.getContext('2d');
  ctxTmp.drawImage(canvasDessin, 0, 0);
  const pixels = ctxTmp.getImageData(0, 0, DESSIN_W, DESSIN_H);
  for (let i = 0; i < pixels.data.length; i += 4) { const l = (pixels.data[i] + pixels.data[i+1] + pixels.data[i+2]) / 3; pixels.data[i] = pixels.data[i+1] = pixels.data[i+2] = 0; pixels.data[i+3] = 255 - l; }
  ctxTmp.putImageData(pixels, 0, 0);
  const px = ctxTmp.getImageData(0, 0, DESSIN_W, DESSIN_H).data;
  let rects = '';
  for (let rangee = 0; rangee < 10; rangee++) {
    const ry = Math.round(posY[rangee]), rh = Math.max(1, Math.round(hauteurs[rangee]));
    for (let col = 0; col < DESSIN_COLS; col++) {
      const cx = Math.round(col * DESSIN_LC), cw = Math.max(1, Math.round(DESSIN_LC));
      let remplis = 0, total = 0;
      for (let py = ry; py < Math.min(ry + rh, DESSIN_H); py++)
        for (let px2 = cx; px2 < Math.min(cx + cw, DESSIN_W); px2++) { if (px[(py * DESSIN_W + px2) * 4 + 3] > 15) remplis++; total++; }
      if (total > 0 && remplis / total >= e.threshold)
        rects += `<rect x="${(col * DESSIN_LC).toFixed(2)}" y="${posY[rangee].toFixed(2)}" width="${(DESSIN_LC - 0.5).toFixed(2)}" height="${(hauteurs[rangee] - 0.5).toFixed(2)}" fill="${e.couleur}"/>`;
    }
  }
  const lien = document.createElement('a');
  lien.href = URL.createObjectURL(new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${(DESSIN_COLS * DESSIN_LC).toFixed(0)}" height="${DESSIN_H}">${rects}</svg>`], { type: 'image/svg+xml' }));
  lien.download = 'dessin-grille.svg';
  lien.click();
};

document.getElementById('drawExportPNG').onclick = function () {
  canvasResultat.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'dessin-grille.png';
    a.click();
  });
};

document.getElementById('brushSize').oninput     = function () { document.getElementById('brushSizeVal').textContent = this.value; };
document.getElementById('drawThreshold').oninput  = function () { document.getElementById('drawThreshVal').textContent = this.value; rendreDessin(); };
document.getElementById('drawColor').oninput      = rendreDessin;

async function chargerEtAfficherGrille() {
  const conteneur = document.getElementById('grilleCartes');
  conteneur.innerHTML = '';
  try {
    const liste = await chargerDepuisBase();
    if (liste.length === 0) return;
    conteneur.innerHTML = liste.map(c => `
      <div class="carte" data-png="${c.apercu_png || ''}">
        <img src="${c.apercu_png || ''}" alt="">
        <div class="carte-info">${c.auteur} · ${new Date(c.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
      </div>
    `).join('');
    conteneur.querySelectorAll('.carte').forEach(carte => {
      carte.onclick = function () {
        document.getElementById('lightboxImg').src = this.dataset.png;
        document.getElementById('lightbox').classList.add('ouvert');
      };
    });
  } catch (e) {}
}

document.getElementById('saveConfirmer').onclick = async function () {
  const titre  = document.getElementById('saveTitre').value.trim();
  const auteur = document.getElementById('saveAuteur').value.trim();
  if (!titre || !auteur) return;

  this.disabled = true;
  try {
    let apercu_png = '';
    if (typeEnAttente === 'texte') {
      const e  = lireEtatTexte();
      const LC = largeurCellule(e.renderSize) * e.zoom;
      const ec = document.createElement('canvas');
      dessinerGrille(ec, e.text.split('').map(ch => pixeliserCaractere(ch, e)), e.renderSize * e.zoom, LC, LC * e.letterSpacing, e.color);
      apercu_png = ec.toDataURL('image/png');
    } else {
      apercu_png = canvasResultat.toDataURL('image/png');
    }
    await sauvegarderEnBase(auteur, titre, typeEnAttente, apercu_png);
    document.getElementById('modalSauvegarde').classList.remove('ouvert');
    if (document.getElementById('mode-grillo').classList.contains('actif')) chargerEtAfficherGrille();
  } catch (e) {}
  this.disabled = false;
};

    document.getElementById('mode-' + this.dataset.mode).classList.add('actif');

  };
});
