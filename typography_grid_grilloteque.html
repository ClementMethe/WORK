<script>

// ─────────────────────────────────────────────
// CONSTANTES GRILLE
// ─────────────────────────────────────────────
const ROW_HEIGHTS  = [19.5, 19.5, 19.5, 19.5, 5, 5, 19.5, 19.5, 19.5, 19.5];
const ROW_TOTAL    = ROW_HEIGHTS.reduce((a, b) => a + b, 0);
const COL_WIDTH    = 5;
const BIG_CANVAS_W = 4000;
const EM           = 1000;
const ASCENDER     =  800;
const DESCENDER    = -200;
const FULL_SPECIMEN =
  "abcdefghijklmnopqrstuvwxyz" +
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
  "0123456789" +
  " !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";

function computeRowMetrics(totalHeight) {
  const heights = ROW_HEIGHTS.map(h => h / ROW_TOTAL * totalHeight);
  const ys = [];
  let y = 0;
  for (let i = 0; i < 10; i++) { ys.push(y); y += heights[i]; }
  return { heights, ys };
}

function cellWidth(totalHeight) {
  return COL_WIDTH / ROW_TOTAL * totalHeight;
}


// ─────────────────────────────────────────────
// PIXELISATION
// ─────────────────────────────────────────────
function pixelizeChar(ch, state) {
  const H  = state.renderSize;
  const CW = cellWidth(H);
  const { heights, ys } = computeRowMetrics(H);

  const bigCanvas = document.createElement('canvas');
  bigCanvas.width  = BIG_CANVAS_W;
  bigCanvas.height = H;
  const bigCtx = bigCanvas.getContext('2d');
  bigCtx.font         = `${state.fontStyle} ${state.fontWeight} ${H * state.fontSize}px ${state.font}`;
  bigCtx.textBaseline = 'alphabetic';
  bigCtx.fillStyle    = '#000';
  bigCtx.fillText(ch, BIG_CANVAS_W / 2, H * 0.78 + state.yOffset);

  const pixels = bigCtx.getImageData(0, 0, BIG_CANVAS_W, H).data;
  let minX = BIG_CANVAS_W, maxX = 0, found = false;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < BIG_CANVAS_W; x++) {
      if (pixels[(y * BIG_CANVAS_W + x) * 4 + 3] > 15) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        found = true;
      }
    }
  }
  if (!found) return { grid: [], cols: 0, cellW: CW };

  const margin = Math.ceil(CW);
  const cropX  = Math.max(0, minX - margin);
  const cropW  = Math.min(BIG_CANVAS_W, maxX + margin + 1) - cropX;

  const cropped    = document.createElement('canvas');
  cropped.width    = cropW;
  cropped.height   = H;
  const croppedCtx = cropped.getContext('2d');
  croppedCtx.drawImage(bigCanvas, cropX, 0, cropW, H, 0, 0, cropW, H);

  const glyphStartX   = minX - cropX;
  const glyphCols     = Math.ceil((maxX - minX + 1) / CW);
  const croppedPixels = croppedCtx.getImageData(0, 0, cropW, H).data;

  const grid = [];
  for (let row = 0; row < 10; row++) {
    grid[row] = [];
    const rowY = Math.round(ys[row]);
    const rowH = Math.max(1, Math.round(heights[row]));
    for (let col = 0; col < glyphCols; col++) {
      const cellX = Math.round(glyphStartX + col * CW);
      const cellW = Math.max(1, Math.round(CW));
      let filled = 0, total = 0;
      for (let py = rowY; py < Math.min(rowY + rowH, H); py++) {
        for (let px = cellX; px < Math.min(cellX + cellW, cropW); px++) {
          if (croppedPixels[(py * cropW + px) * 4 + 3] > 15) filled++;
          total++;
        }
      }
      grid[row][col] = total > 0 && filled / total >= state.threshold;
    }
  }
  return { grid, cols: glyphCols, cellW: CW };
}


// ─────────────────────────────────────────────
// RENDU GRILLE
// ─────────────────────────────────────────────
function renderGrid(targetCanvas, glyphs, gridHeight, colWidth, letterGap, color) {
  const { heights, ys } = computeRowMetrics(gridHeight);
  const totalWidth = glyphs.reduce((sum, g, i) =>
    sum + g.cols * colWidth + (i < glyphs.length - 1 ? letterGap : 0), 0);

  targetCanvas.width  = Math.ceil(totalWidth) + 2;
  targetCanvas.height = Math.ceil(gridHeight) + 2;

  const ctx = targetCanvas.getContext('2d');
  ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

  let xOffset = 1;
  for (const { grid, cols } of glyphs) {
    for (let row = 0; row < 10; row++) {
      for (let col = 0; col < cols; col++) {
        const x  = xOffset + col * colWidth;
        const y  = 1 + ys[row];
        const cw = colWidth - 0.5;
        const ch = heights[row] - 0.5;
        if (grid[row] && grid[row][col]) {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, cw, ch);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.03)';
          ctx.fillRect(x, y, cw, ch);
          ctx.strokeStyle = 'rgba(0,0,0,0.08)';
          ctx.lineWidth = 0.3;
          ctx.strokeRect(x + 0.15, y + 0.15, cw - 0.3, ch - 0.3);
        }
      }
    }
    xOffset += cols * colWidth + letterGap;
  }
}


// ─────────────────────────────────────────────
// EXPORT SVG
// ─────────────────────────────────────────────
function exportSVG(glyphs, colWidth, gridHeight, letterGap, color, filename) {
  const { heights, ys } = computeRowMetrics(gridHeight);
  const totalWidth = glyphs.reduce((sum, g, i) =>
    sum + g.cols * colWidth + (i < glyphs.length - 1 ? letterGap : 0), 0);
  let rects = '', xOffset = 0;
  for (const { grid, cols } of glyphs) {
    for (let row = 0; row < 10; row++) {
      for (let col = 0; col < cols; col++) {
        if (grid[row] && grid[row][col]) {
          const x = xOffset + col * colWidth;
          rects += `<rect x="${x.toFixed(2)}" y="${ys[row].toFixed(2)}" width="${(colWidth - 0.5).toFixed(2)}" height="${(heights[row] - 0.5).toFixed(2)}" fill="${color}"/>`;
        }
      }
    }
    xOffset += cols * colWidth + letterGap;
  }
  const svg  = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth.toFixed(0)}" height="${gridHeight}">${rects}</svg>`;
  const link = document.createElement('a');
  link.href     = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  link.download = filename;
  link.click();
}


// ─────────────────────────────────────────────
// OPENTYPE
// ─────────────────────────────────────────────
function gridToOpenTypePath(grid, cols, colWidth, renderHeight) {
  const { heights, ys } = computeRowMetrics(renderHeight);
  const fontUnitScale   = EM / renderHeight;
  const path = new opentype.Path();
  for (let row = 0; row < 10; row++) {
    const yTop    = ASCENDER - (ys[row] / renderHeight) * (ASCENDER - DESCENDER);
    const yBottom = ASCENDER - ((ys[row] + heights[row]) / renderHeight) * (ASCENDER - DESCENDER);
    for (let col = 0; col < cols; col++) {
      if (!grid[row] || !grid[row][col]) continue;
      const xLeft  = col * colWidth * fontUnitScale;
      const xRight = (col + 1) * colWidth * fontUnitScale;
      path.moveTo(xLeft, yBottom); path.lineTo(xLeft, yTop);
      path.lineTo(xRight, yTop);   path.lineTo(xRight, yBottom);
      path.close();
    }
  }
  return path;
}

function measureKerning(chars, fontString) {
  const MEASURE_PX  = 200;
  const measureFont = fontString.replace(/\d+(\.\d+)?px/, MEASURE_PX + 'px');
  const canvas = document.createElement('canvas');
  canvas.width = 2; canvas.height = 2;
  const ctx = canvas.getContext('2d');
  ctx.font = measureFont;
  ctx.fontKerning = 'normal';
  const singleWidths = {};
  for (const ch of chars) singleWidths[ch] = ctx.measureText(ch).width;
  const kernPairs = {};
  for (const a of chars) {
    for (const b of chars) {
      const kern = ctx.measureText(a + b).width - singleWidths[a] - singleWidths[b];
      if (Math.abs(kern) > 0.1) kernPairs[a + '|' + b] = Math.round(kern * (EM / MEASURE_PX));
    }
  }
  return kernPairs;
}

document.getElementById('exportOTF').onclick = function () {
  if (typeof opentype === 'undefined') { alert('opentype.js non chargé.'); return; }
  const state    = getFontState();
  const fontName = document.getElementById('fontName').value || 'GrilleTypo';
  const status   = document.getElementById('otfStatus');
  const chars    = [...new Set(FULL_SPECIMEN.split(''))].filter(c => c.trim() !== '');
  status.textContent = 'génération…';
  setTimeout(() => {
    const fontString  = `${state.fontStyle} ${state.fontWeight} ${state.renderSize * state.fontSize}px ${state.font}`;
    const kernPairs   = measureKerning(chars, fontString);
    const notdefGlyph = new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 500, path: new opentype.Path() });
    const glyphList   = [notdefGlyph];
    const glyphByChar = {};
    for (const ch of chars) {
      const result = pixelizeChar(ch, state);
      if (!result.cols) continue;
      const glyph = new opentype.Glyph({
        name: 'uni' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'),
        unicode: ch.codePointAt(0),
        advanceWidth: Math.round(result.cols * result.cellW * (EM / state.renderSize)),
        path: gridToOpenTypePath(result.grid, result.cols, result.cellW, state.renderSize)
      });
      glyphList.push(glyph);
      glyphByChar[ch] = glyph;
    }
    const font = new opentype.Font({ familyName: fontName, styleName: 'Regular', unitsPerEm: EM, ascender: ASCENDER, descender: DESCENDER, glyphs: glyphList });
    const kernEntries = [];
    for (const [pair, value] of Object.entries(kernPairs)) {
      const [a, b] = pair.split('|');
      if (glyphByChar[a] && glyphByChar[b])
        kernEntries.push({ leftIndex: glyphList.indexOf(glyphByChar[a]), rightIndex: glyphList.indexOf(glyphByChar[b]), value });
    }
    if (kernEntries.length > 0) font.tables.kern = { version: 0, subtables: [{ coverage: 1, format: 0, pairs: kernEntries }] };
    font.download(fontName + '.otf');
    status.textContent = `✓ ${glyphList.length - 1} glyphes`;
  }, 50);
};


// ─────────────────────────────────────────────
// MODE TEXTE
// ─────────────────────────────────────────────
const mainCanvas = document.getElementById('mainCanvas');

function getFontState() {
  return {
    text:          document.getElementById('inputText').value || 'A',
    font:          document.getElementById('fontSelect').value,
    fontWeight:    document.getElementById('fontWeight').value,
    fontStyle:     document.getElementById('fontStyle').value,
    fontSize:      parseInt(document.getElementById('fontSize').value) / 100,
    threshold:     parseInt(document.getElementById('threshold').value) / 100,
    zoom:          parseFloat(document.getElementById('zoom').value),
    renderSize:    parseInt(document.getElementById('renderSize').value),
    yOffset:       parseInt(document.getElementById('yOffset').value),
    letterSpacing: parseFloat(document.getElementById('letterSpacing').value),
    color:         document.getElementById('textColor').value,
  };
}

function renderFont() {
  const s    = getFontState();
  const CW   = cellWidth(s.renderSize) * s.zoom;
  const H    = s.renderSize * s.zoom;
  const gap  = CW * s.letterSpacing;
  renderGrid(mainCanvas, s.text.split('').map(ch => pixelizeChar(ch, s)), H, CW, gap, s.color);
}

document.getElementById('exportSVG').onclick = function () {
  const s = getFontState();
  const CW = cellWidth(s.renderSize);
  exportSVG(s.text.split('').map(ch => pixelizeChar(ch, s)), CW, s.renderSize, CW * s.letterSpacing, s.color, 'typo-grille.svg');
};

document.getElementById('exportPNG').onclick = function () {
  const s  = getFontState();
  const CW = cellWidth(s.renderSize) * s.zoom;
  const ec = document.createElement('canvas');
  renderGrid(ec, s.text.split('').map(ch => pixelizeChar(ch, s)), s.renderSize * s.zoom, CW, CW * s.letterSpacing, s.color);
  ec.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'typo-grille.png'; a.click(); });
};

document.getElementById('customFontInput').addEventListener('change', async function (e) {
  const file = e.target.files[0]; if (!file) return;
  const name = 'Custom_' + file.name.replace(/\.[^/.]+$/, '').replace(/\s+/g, '_');
  const face = new FontFace(name, await file.arrayBuffer());
  await face.load(); document.fonts.add(face);
  const sel = document.getElementById('fontSelect');
  const opt = document.createElement('option'); opt.value = name; opt.textContent = '✓ ' + file.name.replace(/\.[^/.]+$/, '');
  sel.appendChild(opt); sel.value = name; renderFont();
});

const fontSliders = { threshold: 'threshVal', zoom: 'zoomVal', renderSize: 'rsVal', yOffset: 'yOVal', letterSpacing: 'lsVal', fontSize: 'fontSizeVal' };
for (const [id, labelId] of Object.entries(fontSliders)) {
  document.getElementById(id).oninput = function () { document.getElementById(labelId).textContent = this.value; renderFont(); };
}
['fontSelect', 'fontWeight', 'fontStyle'].forEach(id => document.getElementById(id).onchange = renderFont);
document.getElementById('inputText').oninput = renderFont;
document.getElementById('textColor').oninput = renderFont;


// ─────────────────────────────────────────────
// MODE DESSIN
// ─────────────────────────────────────────────
const DRAW_W = 2700;
const DRAW_H = 900;
const DRAW_CW   = cellWidth(DRAW_H);
const DRAW_COLS = Math.ceil(DRAW_W / DRAW_CW);
const { heights: DRAW_ROW_H, ys: DRAW_ROW_Y } = computeRowMetrics(DRAW_H);

const drawCanvas = document.getElementById('drawCanvas');
const drawCtx    = drawCanvas.getContext('2d');
const drawResult = document.getElementById('drawResult');

drawCanvas.width  = DRAW_W;
drawCanvas.height = DRAW_H;
drawCtx.clearRect(0, 0, DRAW_W, DRAW_H);

const RESULT_W = Math.ceil(DRAW_COLS * DRAW_CW) + 2;
const RESULT_H = Math.ceil(DRAW_H) + 2;
drawResult.width  = RESULT_W;
drawResult.height = RESULT_H;

let isDrawing = false, currentTool = 'draw', lastPos = null;

function getDrawState() {
  return {
    brushSize: parseInt(document.getElementById('brushSize').value),
    threshold: parseInt(document.getElementById('drawThreshold').value) / 100,
    color:     document.getElementById('drawColor').value,
  };
}

function renderDraw() {
  const s = getDrawState();
  const tmp    = document.createElement('canvas');
  tmp.width    = DRAW_W; tmp.height = DRAW_H;
  const tmpCtx = tmp.getContext('2d');
  tmpCtx.drawImage(drawCanvas, 0, 0);
  const pixels = tmpCtx.getImageData(0, 0, DRAW_W, DRAW_H);
  for (let i = 0; i < pixels.data.length; i += 4) {
    const alpha = pixels.data[i + 3];
    pixels.data[i] = pixels.data[i+1] = pixels.data[i+2] = 0;
    pixels.data[i+3] = alpha > 10 ? alpha : 0;
  }
  tmpCtx.putImageData(pixels, 0, 0);
  const scaledPixels = tmpCtx.getImageData(0, 0, DRAW_W, DRAW_H).data;
  const ctx = drawResult.getContext('2d');
  ctx.clearRect(0, 0, RESULT_W, RESULT_H);
  for (let row = 0; row < 10; row++) {
    const rowY = Math.round(DRAW_ROW_Y[row]);
    const rowH = Math.max(1, Math.round(DRAW_ROW_H[row]));
    for (let col = 0; col < DRAW_COLS; col++) {
      const cellX = Math.round(col * DRAW_CW);
      const cellW = Math.max(1, Math.round(DRAW_CW));
      let filled = 0, total = 0;
      for (let py = rowY; py < Math.min(rowY + rowH, DRAW_H); py++)
        for (let px = cellX; px < Math.min(cellX + cellW, DRAW_W); px++) {
          if (scaledPixels[(py * DRAW_W + px) * 4 + 3] > 15) filled++;
          total++;
        }
      const active = total > 0 && filled / total >= s.threshold;
      const x = 1 + col * DRAW_CW, y = 1 + DRAW_ROW_Y[row];
      const dw = DRAW_CW - 0.5, dh = DRAW_ROW_H[row] - 0.5;
      if (active) { ctx.fillStyle = s.color; ctx.fillRect(x, y, dw, dh); }
      else {
        ctx.fillStyle = 'rgba(0,0,0,0.03)'; ctx.fillRect(x, y, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 0.3;
        ctx.strokeRect(x + 0.15, y + 0.15, dw - 0.3, dh - 0.3);
      }
    }
  }
}

function getPos(event, canvas) {
  const rect = canvas.getBoundingClientRect();
  const source = event.touches ? event.touches[0] : event;
  return { x: (source.clientX - rect.left) * (canvas.width / rect.width), y: (source.clientY - rect.top) * (canvas.height / rect.height) };
}

function doStroke(pos) {
  const s = getDrawState();
  drawCtx.globalCompositeOperation = currentTool === 'erase' ? 'destination-out' : 'source-over';
  const ink = currentTool === 'erase' ? 'rgba(0,0,0,1)' : '#000';
  if (lastPos) { drawCtx.strokeStyle = ink; drawCtx.lineWidth = s.brushSize; drawCtx.lineCap = 'round'; drawCtx.beginPath(); drawCtx.moveTo(lastPos.x, lastPos.y); drawCtx.lineTo(pos.x, pos.y); drawCtx.stroke(); }
  drawCtx.fillStyle = ink; drawCtx.beginPath(); drawCtx.arc(pos.x, pos.y, s.brushSize / 2, 0, Math.PI * 2); drawCtx.fill();
  lastPos = pos; renderDraw();
}

drawCanvas.addEventListener('mousedown',  e => { isDrawing = true;  lastPos = null; doStroke(getPos(e, drawCanvas)); });
drawCanvas.addEventListener('mousemove',  e => { if (isDrawing) doStroke(getPos(e, drawCanvas)); });
drawCanvas.addEventListener('mouseup',    () => { isDrawing = false; lastPos = null; });
drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; lastPos = null; });
drawCanvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true;  lastPos = null; doStroke(getPos(e, drawCanvas)); }, { passive: false });
drawCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (isDrawing) doStroke(getPos(e, drawCanvas)); }, { passive: false });
drawCanvas.addEventListener('touchend',   () => { isDrawing = false; lastPos = null; });

document.getElementById('toolDraw').onclick  = function () { currentTool = 'draw';  this.style.borderColor = '#111'; document.getElementById('toolErase').style.borderColor = ''; };
document.getElementById('toolErase').onclick = function () { currentTool = 'erase'; this.style.borderColor = '#111'; document.getElementById('toolDraw').style.borderColor = ''; };
document.getElementById('clearDraw').onclick = function () { drawCtx.globalCompositeOperation = 'source-over'; drawCtx.clearRect(0, 0, DRAW_W, DRAW_H); drawResult.getContext('2d').clearRect(0, 0, RESULT_W, RESULT_H); };

document.getElementById('drawExportSVG').onclick = function () {
  const s = getDrawState();
  const { heights, ys } = computeRowMetrics(DRAW_H);
  const tmp = document.createElement('canvas'); tmp.width = DRAW_W; tmp.height = DRAW_H;
  const tmpCtx = tmp.getContext('2d'); tmpCtx.drawImage(drawCanvas, 0, 0);
  const pixels = tmpCtx.getImageData(0, 0, DRAW_W, DRAW_H);
  for (let i = 0; i < pixels.data.length; i += 4) { const lum = (pixels.data[i] + pixels.data[i+1] + pixels.data[i+2]) / 3; pixels.data[i] = pixels.data[i+1] = pixels.data[i+2] = 0; pixels.data[i+3] = 255 - lum; }
  tmpCtx.putImageData(pixels, 0, 0);
  const px = tmpCtx.getImageData(0, 0, DRAW_W, DRAW_H).data;
  let rects = '';
  for (let row = 0; row < 10; row++) {
    const rowY = Math.round(ys[row]), rowH = Math.max(1, Math.round(heights[row]));
    for (let col = 0; col < DRAW_COLS; col++) {
      const cellX = Math.round(col * DRAW_CW), cellW = Math.max(1, Math.round(DRAW_CW));
      let filled = 0, total = 0;
      for (let py = rowY; py < Math.min(rowY + rowH, DRAW_H); py++)
        for (let px2 = cellX; px2 < Math.min(cellX + cellW, DRAW_W); px2++) { if (px[(py * DRAW_W + px2) * 4 + 3] > 15) filled++; total++; }
      if (total > 0 && filled / total >= s.threshold)
        rects += `<rect x="${(col * DRAW_CW).toFixed(2)}" y="${ys[row].toFixed(2)}" width="${(DRAW_CW - 0.5).toFixed(2)}" height="${(heights[row] - 0.5).toFixed(2)}" fill="${s.color}"/>`;
    }
  }
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${(DRAW_COLS * DRAW_CW).toFixed(0)}" height="${DRAW_H}">${rects}</svg>`], { type: 'image/svg+xml' }));
  link.download = 'dessin-grille.svg'; link.click();
};

document.getElementById('drawExportPNG').onclick = function () {
  drawResult.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'dessin-grille.png'; a.click(); });
};

document.getElementById('brushSize').oninput    = function () { document.getElementById('brushSizeVal').textContent = this.value; };
document.getElementById('drawThreshold').oninput = function () { document.getElementById('drawThreshVal').textContent = this.value; renderDraw(); };
document.getElementById('drawColor').oninput     = renderDraw;


// ─────────────────────────────────────────────
// GRILLOTHÈQUE
// ─────────────────────────────────────────────
function formaterDate(iso) {
  return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}

async function chargerEtAfficher() {
  const grid   = document.getElementById('grilloGrid');
  const status = document.getElementById('grilloStatus');
  grid.innerHTML = '<div class="grillo-msg">Chargement…</div>';
  status.textContent = '';
  try {
    const liste = await charger();
    if (liste.length === 0) { grid.innerHTML = '<div class="grillo-msg">Aucune création pour le moment.</div>'; return; }
    grid.innerHTML = liste.map(c => `
      <div class="grillo-card" data-png="${c.apercu_png || ''}">
        <img src="${c.apercu_png || ''}" alt="${c.titre}">
        <div class="grillo-card-info">
          <div class="grillo-card-title">${c.titre}</div>
          <div class="grillo-card-meta">${c.auteur} · ${formaterDate(c.created_at)}</div>
        </div>
      </div>
    `).join('');
    // Clic sur une carte → lightbox
    grid.querySelectorAll('.grillo-card').forEach(card => {
      card.onclick = function () {
        const png = this.dataset.png;
        if (!png) return;
        document.getElementById('lightboxImg').src = png;
        document.getElementById('lightbox').classList.add('open');
      };
    });
    status.textContent = liste.length + ' création' + (liste.length > 1 ? 's' : '');
  } catch (err) {
    grid.innerHTML = '<div class="grillo-msg">Erreur de connexion.</div>';
    status.textContent = err.message;
  }
}

document.getElementById('grilloRefresh').onclick = chargerEtAfficher;

document.getElementById('lightboxClose').onclick = function () { document.getElementById('lightbox').classList.remove('open'); };
document.getElementById('lightbox').onclick = function (e) { if (e.target === this) this.classList.remove('open'); };


// ─────────────────────────────────────────────
// MODAL SAUVEGARDE
// ─────────────────────────────────────────────
let pendingType = null;

function ouvrirModal(type) {
  pendingType = type;
  document.getElementById('saveTitle').value  = '';
  document.getElementById('saveAuthor').value = '';
  document.getElementById('saveStatus').textContent = '';
  document.getElementById('saveModal').classList.add('open');
  document.getElementById('saveTitle').focus();
}

document.getElementById('saveFont').onclick   = () => ouvrirModal('texte');
document.getElementById('saveDraw').onclick   = () => ouvrirModal('dessin');
document.getElementById('saveCancel').onclick = () => document.getElementById('saveModal').classList.remove('open');
document.getElementById('saveModal').onclick  = function (e) { if (e.target === this) this.classList.remove('open'); };

document.getElementById('saveConfirm').onclick = async function () {
  const titre  = document.getElementById('saveTitle').value.trim();
  const auteur = document.getElementById('saveAuthor').value.trim();
  const status = document.getElementById('saveStatus');
  if (!titre || !auteur) { status.textContent = 'Remplis les deux champs.'; return; }

  status.textContent = '…';
  this.disabled = true;

  try {
    let apercu_png = '';
    if (pendingType === 'texte') {
      const s  = getFontState();
      const CW = cellWidth(s.renderSize) * s.zoom;
      const H  = s.renderSize * s.zoom;
      const ec = document.createElement('canvas');
      renderGrid(ec, s.text.split('').map(ch => pixelizeChar(ch, s)), H, CW, CW * s.letterSpacing, s.color);
      apercu_png = ec.toDataURL('image/png');
    } else {
      apercu_png = drawResult.toDataURL('image/png');
    }

    await sauvegarder(auteur, titre, pendingType, apercu_png);
    status.textContent = '✓';
    setTimeout(() => {
      document.getElementById('saveModal').classList.remove('open');
      if (document.getElementById('mode-grillo').classList.contains('active')) chargerEtAfficher();
    }, 600);
  } catch (err) {
    status.textContent = 'Erreur : ' + err.message;
  }
  this.disabled = false;
};


// ─────────────────────────────────────────────
// ONGLETS
// ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = function () {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('mode-' + this.dataset.mode).classList.add('active');
    if (this.dataset.mode === 'grillo') chargerEtAfficher();
  };
});

renderFont();
